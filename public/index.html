<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lagos Zombie Survival 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="char-select-screen" class="overlay-screen">
        <div class="card-modal">
            <h2>SURVIVOR REGISTRATION</h2>
            <p>Choose your gender to enter Eko Safehouse Lounge</p>

            <div class="gender-selection">
                <button id="btn-male" class="gender-btn active" type="button">
                    <span class="gender-icon">👨</span>
                    <span>Male</span>
                </button>
                <button id="btn-female" class="gender-btn" type="button">
                    <span class="gender-icon">👩</span>
                    <span>Female</span>
                </button>
            </div>

            <button id="btn-start-game" class="primary-btn" type="button">ENTER GAME WORLD</button>
        </div>
    </div>

    <div id="game-viewport"></div>

    <script src="game.js"></script>
</body>
    </html>
